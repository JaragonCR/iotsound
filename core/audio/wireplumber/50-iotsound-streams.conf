# IoTSound stream rules for WirePlumber.
#
# WirePlumber remembers the volume of a stream and restores it onto the next stream with the
# same identity. For streams that set media.role, the identity is the role alone. snapclient
# and Spotify Soloist both use the role "music", so they shared one saved volume: whatever
# Spotify volume was last set got restored onto the next snapclient stream on that device.
# The speaker that was sourcing then played its own snapclient at 50% or 75% on top of the
# Spotify volume while every other speaker played at 100% (seen on device: -18 dB on the
# source speaker only).
#
# snapclient's level is owned by Snapcast (group volume, applied in snapclient itself), so
# its PipeWire stream must always sit at 100% and must never save or restore a volume.
stream.rules = [
  {
    matches = [
      { application.name = "Snapcast" }
      { application.process.binary = "snapclient" }
    ]
    actions = {
      update-props = {
        state.restore-props = false
      }
    }
  }
]
